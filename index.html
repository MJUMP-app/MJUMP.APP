<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Фиксатор — Пермский край</title><script src="https://telegram.org"></script><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:radial-gradient(circle at 10% 10%,#00d2b840,transparent 40%),linear-gradient(#00d2b80c 1px,transparent 1px),linear-gradient(90deg,#00d2b80c 1px,transparent 1px),#06080A;background-size:100%,30px 30px,30px 30px;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.w{width:100%;max-width:450px}
.nl{width:180px;height:auto;display:block;margin:0 0 12px 2px;filter:drop-shadow(0 4px 12px #00d2b845)}
.app{background:#13171ef0;border-radius:18px;border:1px solid #00d2b850;overflow:hidden}
.sd{padding:15px;border-bottom:1px solid #00d2b830;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#00d2b820,transparent)}
.av{width:52px;height:52px;border-radius:13px;border:2px solid #00D2B8;overflow:hidden;flex-shrink:0;background:#000}.av img{width:100%;height:100%;object-fit:cover}
h1{font-size:19px;font-weight:900}.sb{font-size:12px;color:#00D2B8;font-weight:700}.di{display:none}.mn{padding:15px}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#0A0D12;padding:4px;border-radius:10px;border:1px solid #2A303C;margin-bottom:12px}
.t{padding:8px;border:0;border-radius:7px;background:none;color:#8E95A5;font-size:13px;font-weight:800;cursor:pointer}.t.on{background:#00D2B8;color:#000}
.fg{margin-bottom:11px;position:relative}
label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:4px}
.n{background:#00D2B8;color:#000;font-size:11px;font-weight:900;width:18px;height:18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center}
input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #2A303C;background:#0A0D12;color:#fff;font-size:16px;outline:0}
input:focus,textarea:focus{border-color:#00D2B8}textarea{resize:vertical;min-height:58px}
.geo{margin-top:5px;padding:5px 9px;border-radius:7px;background:#00d2b820;color:#00D2B8;font-size:12px;font-weight:700;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.fl{border:2px dashed #00d2b880;background:#00d2b80f;border-radius:10px;padding:11px;color:#00D2B8;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.wn{font-size:11px;color:#9CA3AF;margin-bottom:11px;text-align:center}
.btn{width:100%;padding:13px;border:0;border-radius:11px;background:#00D2B8;color:#000;font-size:15px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.6}
.ok{display:none;text-align:center;padding:25px 10px}.ok h2{color:#00D2B8;margin-bottom:6px}.ok p{color:#9CA3AF;font-size:13px;margin-bottom:15px}
.ic{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2}
@media(min-width:768px){.w{max-width:800px}.nl{width:220px;margin-bottom:14px}.app{display:grid;grid-template-columns:240px 1fr}.sd{flex-direction:column;align-items:flex-start;justify-content:space-between;border-bottom:0;border-right:1px solid #00d2b830;padding:20px}.av{width:76px;height:76px;margin-bottom:10px}h1{font-size:22px}.di{display:block;margin-top:12px;font-size:12px;color:#9CA3AF;line-height:1.4}.mn{padding:20px}}
</style></head><body>
<div class="w"><svg class="nl" viewBox="0 0 280 124"><path d="M14 40L212 8l-5 24 61-7-7 35-58 9 52-5-7 39-212 17 5-32-33 5z" fill="#00D2B8"/><text x="52" y="34" fill="#06080A" font-weight="900" font-size="14" letter-spacing="4">ПАРТИЯ</text><text x="48" y="69" fill="#06080A" font-weight="900" font-size="37">НОВЫЕ</text><text x="46" y="103" fill="#06080A" font-weight="900" font-size="37">ЛЮДИ</text></svg>
<div class="app"><div class="sd"><div><div class="av"><img id="lg" src="https://yandex.net" alt="Фиксатор"></div><div><h1>ФИКСАТОР</h1><div class="sb">● Пермский край • На связи</div></div><div class="di"><b style="color:#fff">Анонимная фиксация</b><br><br>Без телефона, почты и ФИО. Нужны адрес, фото/видео и суть обращения.</div></div><div class="di" style="color:#00D2B8">До 2 файлов • 24/7</div></div>
<div class="mn"><form id="f" autocomplete="off">
<div class="tb"><button type="button" class="t on" onclick="setT('Жалоба',this)">Жалоба</button><button type="button" class="t" onclick="setT('Предложение',this)">Предложение</button></div><input type="hidden" id="tp" value="Жалоба">
<div class="fg"><label>Ваш регион</label><input id="rg" value="Пермский край" required></div>
<div class="fg"><label><span class="n">1</span>Адрес или координаты</label><input id="ad" placeholder="Пермь, ул. Ленина, 42, у остановки..." required><button type="button" class="geo" id="gb" onclick="getGeo()"><svg class="ic" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span>Мои координаты</span></button></div>
<div class="fg"><label><span class="n">2</span><span id="l2">Фото или видео (1–2 файла)</span></label><div class="fl" id="fl" onclick="fi.click()"><svg class="ic" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><span id="ft">Прикрепить фото/видео</span><input type="file" id="fi" hidden multiple accept="image/*,video/*"></div></div>
<div class="fg"><label><span class="n">3</span><span id="l3">Что случилось и как давно</span></label><textarea id="ds" placeholder="Лёд у подъезда, третий день, люди падают..." required></textarea></div>
<div class="fg"><label><span class="n">4</span><span id="l4">Сколько человек жалуется</span></label><input id="cn" placeholder="1, 4 или весь подъезд" required></div>
<div class="wn">Почту, телефон, ФИО и паспорт не спрашиваем</div>
<button class="btn" id="bt">Отправить обращение</button>
</form><div class="ok" id="ok"><h2>Обращение принято!</h2><p>Данные переданы в Пермский штаб партии.</p><button class="btn" onclick="f.reset();rg.value='Пермский край';ft.textContent='Прикрепить фото/видео';ok.style.display='none';f.style.display='block'">Отправить ещё</button></div></div></div></div>
<script>
const SCRIPT_URL='https://google.com';
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
const setT=(v,b)=>{tp.value=v;document.querySelectorAll('.t').forEach(x=>x.classList.remove('on'));b.classList.add('on');const p=v==='Предложение';l2.textContent=p?'Фото или схема (необязательно)':'Фото или видео (1–2 файла)';l3.textContent=p?'Суть предложения или идеи':'Что случилось и как давно';ds.placeholder=p?'Опишите, что нужно улучшить или построить...':'Лёд у подъезда, третий день, люди падают...';l4.textContent=p?'Сколько человек поддерживает':'Сколько человек жалуется'};
const getGeo=()=>{const s=gb.querySelector('span');if(!navigator.geolocation)return alert('Нет GPS');s.textContent='...';navigator.geolocation.getCurrentPosition(p=>{ad.value=`${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`;s.textContent='Готово'},()=>{s.textContent='Мои координаты';alert('Нет доступа к GPS')})};
const updF=()=>{if(fi.files.length>2){alert('Макс. 2 файла');fi.value='';return ft.textContent='Прикрепить фото/видео'}ft.textContent=fi.files.length?Array.from(fi.files).map(x=>x.name).join(' • '):'Прикрепить фото/видео'};
fi.onchange=updF;fl.ondragover=e=>e.preventDefault();fl.ondrop=e=>{e.preventDefault();if(e.dataTransfer.files.length){fi.files=e.dataTransfer.files;updF()}};
const zipImg=f=>new Promise(res=>{if(!f.type.startsWith('image/'))return res(f);const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{URL.revokeObjectURL(u);let w=img.width,h=img.height,m=1600;if(w>m||h>m){if(w>h){h=Math.round(h*m/w);w=m}else{w=Math.round(w*m/h);h=m}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>res(b?new File([b],'photo.jpg',{type:'image/jpeg'}):f),'image/jpeg',0.82)};img.onerror=()=>res(f);img.src=u});
const toB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({name:f.name,type:f.type,data:r.result});r.onerror=rej;r.readAsDataURL(f)});
f.onsubmit=async e=>{e.preventDefault();const raw=Array.from(fi.files);if(tp.value==='Жалоба'&&!raw.length)return alert('Прикрепите фото/видео');bt.disabled=1;bt.textContent='Отправка...';try{const fs=await Promise.all(raw.map(zipImg));const files=await Promise.all(fs.map(toB64));await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({t:tp.value,r:rg.value,a:ad.value,d:ds.value,c:cn.value,files})});f.style.display='none';ok.style.display='block'}catch(err){alert('Ошибка: '+(err.message||err))}finally{bt.disabled=0;bt.textContent='Отправить обращение'}};
</script></body></html>
